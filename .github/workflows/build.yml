name: Build

# Builds a release binary for Linux and attaches it to a GitHub release when a `v*` tag is pushed.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git \
            libgtk-4-dev libadwaita-1-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash # container steps default to sh, which lacks ${var//…}
        run: |
          name="larder-${GITHUB_REF_NAME//\//-}-x86_64-linux"
          mkdir "$name"
          cp target/release/larder README.md "$name/"
          strip "$name/larder"
          tar czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE }}
          generate_release_notes: true
