name: Build

# Builds Larder for Linux (x86_64 and aarch64 tarballs, .deb and AppImage), Windows and macOS, plus a source tarball
# with all dependencies vendored (what the Flathub build downloads). Pushing a `v*` tag
# publishes the packages, a SHA256SUMS file and build attestations as a GitHub release. Manual runs
# and pull requests that touch packaging keep everything as workflow artifacts for testing, along
# with a screenshot of the packaged app running on each platform.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - Cargo.toml
      - Cargo.lock
      - data/**

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Built on Ubuntu 24.04 so the binary and .deb also run there (GTK 4.14, libadwaita 1.5).
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev \
            xvfb imagemagick
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          name="larder-$version-${{ matrix.arch }}-linux"
          strip target/release/larder
          # Laid out like an install prefix: extracting it into ~/.local installs Larder for the user.
          mkdir -p "$name/bin" "$name/share/applications" "$name/share/metainfo" "$name/share/doc/larder" dist
          cp target/release/larder "$name/bin/"
          cp data/*.desktop "$name/share/applications/"
          cp data/*.metainfo.xml "$name/share/metainfo/"
          cp -r data/icons "$name/share/"
          cp LICENSE README.md "$name/share/doc/larder/"
          tar czf "dist/$name.tar.gz" "$name"
          cargo deb --no-build --no-strip --output dist/
          ls -l dist
      - name: AppImage
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          arch=$(uname -m)
          tools=$RUNNER_TEMP/tools
          mkdir -p "$tools"
          base=https://github.com/linuxdeploy
          curl -fsSL -o "$tools/linuxdeploy" "$base/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk.sh" "$base/linuxdeploy-plugin-gtk/raw/master/linuxdeploy-plugin-gtk.sh"
          # appimagetool >= 1.9 writes the type2 runtime, which has FUSE built in: no libfuse2 needed to run the result.
          curl -fsSL -o "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          chmod +x "$tools"/*
          export PATH="$tools:$PATH"
          # The build tools are AppImages too, and the runner has no libfuse2, so run them extracted.
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Collects the binary, its libraries, the GTK/GLib schemas, pixbuf loaders and icon themes into an AppDir.
          DEPLOY_GTK_VERSION=4 linuxdeploy --appdir AppDir \
            --executable target/release/larder \
            --desktop-file data/io.github.arturo_source.Larder.desktop \
            --icon-file data/icons/hicolor/512x512/apps/io.github.arturo_source.Larder.png \
            --plugin gtk
          mkdir -p AppDir/usr/share/metainfo
          cp data/*.metainfo.xml AppDir/usr/share/metainfo/
          ARCH=$arch appimagetool AppDir "dist/larder-$version-$arch.AppImage"
          ls -l dist
      - name: Smoke test
        run: |
          # No APPIMAGE_EXTRACT_AND_RUN here: this is the real FUSE mount, which must work without libfuse2.
          chmod +x dist/*.AppImage
          dist/*.AppImage --version
          sudo apt-get install -y ./dist/*.deb
          larder --version
          xvfb-run -s "-screen 0 1280x800x24" sh -c \
            'larder & sleep 8; import -window root screenshot-linux-${{ matrix.arch }}.png; kill $!'
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux-${{ matrix.arch }}
          path: screenshot-*.png

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          name="larder-$version-x86_64-windows"
          mkdir -p "$name/bin" "$name/lib" "$name/share/glib-2.0" "$name/share/icons" dist
          cp target/release/larder.exe "$name/bin/"
          # Image loaders, settings schemas and icon themes GTK reads at runtime.
          cp -r /ucrt64/lib/gdk-pixbuf-2.0 "$name/lib/"
          cp -r /ucrt64/share/glib-2.0/schemas "$name/share/glib-2.0/"
          cp -r /ucrt64/share/icons/Adwaita /ucrt64/share/icons/hicolor "$name/share/icons/"
          cp -r data/icons/hicolor/. "$name/share/icons/hicolor/"
          # Every DLL the app and the image loaders need, found the way Windows will (next to the .exe).
          for f in target/release/larder.exe /ucrt64/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
            ldd "$f" | awk '$3 ~ /^\/ucrt64\// {print $3}'
          done | sort -u | xargs -I{} cp {} "$name/bin/"
          cp LICENSE README.md "$name/"
          zip -qr "dist/$name.zip" "$name"
          echo "PKG_DIR=$name" >> "$GITHUB_ENV"
      - name: Smoke test (outside MSYS2, using only the bundled DLLs)
        shell: pwsh
        run: |
          $exe = Join-Path $env:PKG_DIR "bin\larder.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "larder.exe --version exited with $($p.ExitCode)" }
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot-windows.png")
          if (-not (Get-Process larder -ErrorAction SilentlyContinue)) { throw "larder.exe is not running" }
          Stop-Process -Name larder
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x86_64
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: screenshot-*.png

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install gtk4 libadwaita adwaita-icon-theme dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          name="larder-$version-arm64-macos"
          brew=$(brew --prefix)
          app=Larder.app
          res="$app/Contents/Resources"
          loaders="lib/gdk-pixbuf-2.0/2.10.0/loaders"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Frameworks" "$res/share/glib-2.0" "$res/share/icons" "$res/$loaders" dist
          cp target/release/larder "$app/Contents/MacOS/larder-bin"
          cp "$brew/$loaders"/*.so "$res/$loaders/"
          # Copy every Homebrew library the app and the image loaders need into the bundle.
          dylibbundler -of -b -s "$brew/lib" -d "$app/Contents/Frameworks" -p @executable_path/../Frameworks/ \
            -x "$app/Contents/MacOS/larder-bin" $(for f in "$res/$loaders"/*.so; do echo -x "$f"; done) < /dev/null
          cp -r "$brew/share/glib-2.0/schemas" "$res/share/glib-2.0/"
          glib-compile-schemas "$res/share/glib-2.0/schemas"
          cp -r "$brew/share/icons/Adwaita" "$brew/share/icons/hicolor" "$res/share/icons/"
          cp -r data/icons/hicolor/. "$res/share/icons/hicolor/"
          # The loader cache needs absolute paths, so the launcher fills them in at startup.
          GDK_PIXBUF_MODULEDIR="$PWD/$res/$loaders" gdk-pixbuf-query-loaders | sed "s|$PWD/$res|@RES@|g" > "$res/loaders.cache.in"
          cat > "$app/Contents/MacOS/larder" <<'EOF'
          #!/bin/sh
          here="$(cd "$(dirname "$0")" && pwd)"
          res="$(cd "$here/../Resources" && pwd)"
          export XDG_DATA_DIRS="$res/share"
          export GSETTINGS_SCHEMA_DIR="$res/share/glib-2.0/schemas"
          export GDK_PIXBUF_MODULE_FILE="${TMPDIR:-/tmp}/larder-loaders.cache"
          sed "s|@RES@|$res|g" "$res/loaders.cache.in" > "$GDK_PIXBUF_MODULE_FILE"
          exec "$here/larder-bin" "$@"
          EOF
          chmod +x "$app/Contents/MacOS/larder"
          mkdir larder.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s data/icons/hicolor/512x512/apps/io.github.arturo_source.Larder.png --out "larder.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) data/icons/hicolor/512x512/apps/io.github.arturo_source.Larder.png --out "larder.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns larder.iconset -o "$res/larder.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Larder</string>
            <key>CFBundleDisplayName</key><string>Larder</string>
            <key>CFBundleIdentifier</key><string>io.github.arturo_source.Larder</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleExecutable</key><string>larder</string>
            <key>CFBundleIconFile</key><string>larder.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Not notarized: an ad-hoc signature is the minimum Apple Silicon needs to run it.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/$name.zip"
      - name: Smoke test
        run: |
          if otool -L Larder.app/Contents/MacOS/larder-bin Larder.app/Contents/Frameworks/*.dylib | grep -E "^\s+(/opt/homebrew|/usr/local)/"; then
            echo "bundle still references Homebrew libraries" && exit 1
          fi
          Larder.app/Contents/MacOS/larder --version
          Larder.app/Contents/MacOS/larder & pid=$!
          sleep 10
          screencapture -x screenshot-macos.png
          kill -0 $pid && kill $pid
          # CI Macs are VMs without a real GPU; a software-rendered screenshot shows whether the app itself is fine.
          GSK_RENDERER=cairo Larder.app/Contents/MacOS/larder & pid=$!
          sleep 10
          screencapture -x screenshot-macos-software.png
          kill -0 $pid && kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos
          path: screenshot-*.png

  source:
    name: Vendored source
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vendor-filterer
      - name: Create tarball
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          name="larder-$version"
          mkdir -p stage dist
          git archive --prefix="$name/" HEAD | tar x -C stage
          cd "stage/$name"
          mkdir .cargo
          # Only what Linux builds need (Flathub builds x86_64 and aarch64); crates for other
          # platforms become empty stubs, which keeps the tarball about a third smaller.
          cargo vendor-filterer --platform=x86_64-unknown-linux-gnu --platform=aarch64-unknown-linux-gnu \
            vendor > .cargo/config.toml
          cd ..
          tar cJf "../dist/$name-vendored.tar.xz" "$name"
          ls -l ../dist
      - name: Check it builds offline
        run: |
          mkdir offline
          tar xJf dist/*-vendored.tar.xz -C offline
          cd offline/larder-*
          CARGO_HOME="$RUNNER_TEMP/empty-cargo-home" cargo check --offline --locked
      - uses: actions/upload-artifact@v4
        with:
          name: package-source
          path: dist/*

  release:
    name: Checksums, attestations & release
    needs: [linux, windows, macos, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! ls dist | grep -q "^larder-${GITHUB_REF_NAME#v}-"; then
            echo "Tag $GITHUB_REF_NAME does not match the version the packages were built with:"
            ls dist
            echo "Bump 'version' in Cargo.toml (and add a <release> to the metainfo) before tagging."
            exit 1
          fi
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: larder-packages
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
