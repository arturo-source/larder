name: CI

# Checks that must pass before merging: formatting, lints, tests (including the end-to-end test
# against a real S3 server), docs and the desktop/AppStream metadata.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy, tests & docs
    # Ubuntu 24.04 has the oldest GTK (4.14) and libadwaita (1.5) we support.
    runs-on: ubuntu-24.04
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    env:
      LARDER_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev \
            desktop-file-utils appstream
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate desktop file and AppStream metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Wait for RustFS
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000 && exit 0
            sleep 2
          done
          echo "RustFS did not come up" && exit 1
      - name: Tests
        run: cargo test --locked
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
