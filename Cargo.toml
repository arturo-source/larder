[package]
name = "larder"
version = "0.1.1"
edition = "2024"
description = "Browse and manage S3-compatible object storage"
license = "MIT"
authors = ["Arturo Martínez"]
repository = "https://github.com/arturo-source/larder"
readme = "README.md"
keywords = ["s3", "gtk", "libadwaita", "object-storage"]
categories = ["gui"]

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.137.0", features = ["behavior-version-latest"] }
chrono = "0.4.45"
dirs = "7.0.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
urlencoding = "2.1.3"


# `cargo deb` packaging. Library dependencies (GTK, libadwaita, …) are detected from the binary; the
# icon theme and SVG loader are only "recommended" by GTK, but icons are broken without them.
[package.metadata.deb]
section = "net"
depends = "$auto, adwaita-icon-theme, librsvg2-common"
extended-description = "Browse buckets and folders, upload and download files, preview text and images and share objects with expiring links on Amazon S3 or any S3-compatible service."
assets = [
  ["target/release/larder", "usr/bin/", "755"],
  ["data/io.github.arturo_source.Larder.desktop", "usr/share/applications/", "644"],
  ["data/io.github.arturo_source.Larder.metainfo.xml", "usr/share/metainfo/", "644"],
  ["data/icons/hicolor/512x512/apps/io.github.arturo_source.Larder.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
  ["data/icons/hicolor/256x256/apps/io.github.arturo_source.Larder.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
  ["data/icons/hicolor/128x128/apps/io.github.arturo_source.Larder.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
  ["README.md", "usr/share/doc/larder/", "644"],
]
