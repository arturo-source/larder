[package]
name = "larder"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.137.0", features = ["behavior-version-latest"] }
chrono = "0.4.45"
dirs = "7.0.0"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
urlencoding = "2.1.3"

